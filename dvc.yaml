stages:
  split:
    cmd: >-
      python preprocessing/temporal_split.py
      --input data/raw/MASTER_hardware_peru.csv
      --output-dir data/splits
      --train-ratio ${preprocessing.train_ratio}
      --val-ratio ${preprocessing.val_ratio}
    deps:
      - data/raw/MASTER_hardware_peru.csv
      - preprocessing/temporal_split.py
    params:
      - params.yaml:
        - preprocessing.train_ratio
        - preprocessing.val_ratio
    outs:
      - path: data/splits/
        push: false

  feature_engineering:
    cmd: >-
      python preprocessing/feature_engineering.py
      --input-dir data/splits
      --output-dir data/features
    deps:
      - data/splits/
      - preprocessing/feature_engineering.py
    params:
      - params.yaml:
        - preprocessing.zscore_window
    outs:
      - path: data/features/
        push: false

  preprocess:
    cmd: >-
      python preprocessing/mice_imputer.py
      --input-dir data/features
      --output-dir data/processed
      --max-iter ${preprocessing.mice_max_iter}
    deps:
      - data/features/
      - preprocessing/mice_imputer.py
    params:
      - params.yaml:
        - preprocessing.mice_max_iter
    outs:
      - path: data/processed/
        push: false
